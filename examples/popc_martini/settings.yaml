hybrid:
  includes:
    - amber99sb-ildn_slipids.ff/forcefield.itp

cg_system:
  coordinates: cg_conf.gro
  topology: topol_cg.top
  format: gromacs
  nonbonded:
    kind: martini
    cutoff: 1.1
    epsilon_r: 15.0
    epsilon_rf: 0.0

simulation:
  protocol: robust
  alpha: 0.0001
  initial_resolution: 0.0
  timestep: 0.001
  timestep_backmapping: 0.001
  equilibration_steps: 0
  production_steps: 0
  temperature: 310.0
  ensemble: nvt
  thermostat: nose_hoover
  thermostat_gamma: 30.0
  thermostat_tdamp: 0.1
  thermostat_target: atomistic
  lj_cutoff: 1.4              # nm, Slipids plain LJ cut-off
  cg_cutoff: 1.1              # nm, MARTINI
  coulomb_cutoff: 1.4         # nm, cut-off Coulomb during the ramp (PME after)
  exclusion_nrexcl: 3         # Slipids
  table_points: 10000         # CG tables match GROMACS to its printed precision
  exclusion_nrexcl_cg: 1      # MARTINI
  energy_interval: 1000
  trajectory_interval: 1000
  rng_seed: 12345

output:
  prefix: popc
  format: lammps
  units: real
