#     from the CG topology (LJ potential-shift + reaction field, eps_r 15).
# AT: Slipids (amber99sb-ildn_slipids.ff), TIP3P, flexible during backmapping.
# Mapping: CG2AT martini_3-0_slipids fragments. Run fetch_sources.sh first.

