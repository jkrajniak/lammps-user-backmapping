name: Release Smoke Test (PET/Dacron)

# Runs a short end-to-end LAMMPS simulation of the PET/Dacron network --
# the most structurally complex validated example (crosslinked, explicit
# water, non-uniform bonded terms) -- to catch protocol/build regressions
# before a release, not on every push. Deliberately NOT run on every PR:
# it builds LAMMPS from source and runs real dynamics, which is too slow
# and too expensive to run on every merge.
#
# This exists because a build regression (missing MOLECULE/RIGID LAMMPS
# packages -- see cpp-ci.yml's build job, which has the same gap: it only
# checks `lmp -h` for backmap style registration, never runs an actual
# example) and a protocol regression (CG particles given their own
# integrator, fighting fix backmap's own centre-of-mass tracking) both
# went undetected through normal CI in 2026-07, costing a full night of
# manual debugging. See research/checkpoints.md and
# research/experiments/20260728_pet-regen-cg-integration-root-cause.md.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      scale:
        description: "Divide every stage length of the generated protocol by this factor"
        default: "10"

env:
  LAMMPS_VERSION: stable_22Jul2025_update2

jobs:
  pet-dacron-smoke:
    name: PET/Dacron bakery-faithful protocol smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libopenmpi-dev

      - name: Cache LAMMPS source
        uses: actions/cache@v4
        id: cache-lammps
        with:
          path: lammps
          key: lammps-${{ env.LAMMPS_VERSION }}-smoke-ubuntu

      - name: Download LAMMPS
        if: steps.cache-lammps.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch ${{ env.LAMMPS_VERSION }} \
            https://github.com/lammps/lammps.git

      - name: Clean stale artifacts from cached LAMMPS tree
        run: |
          cd lammps/src
          rm -f *_backmap*.cpp *_backmap*.h fix_backmap.* pair_backmap.* backmap_lambda.h
          rm -rf BACKMAP
          make no-all purge 2>/dev/null || true
          cd ../..
          rm -rf lammps/build

      - name: Install package into LAMMPS
        run: ./install.sh lammps

      # PET/Dacron needs MOLECULE (atom_style full) and RIGID (fix shake)
      # in addition to BACKMAP. cpp-ci.yml's build job only enables
      # BACKMAP -- deliberately not "fixed" here to keep this workflow's
      # build step independent and catch the same class of regression on
      # its own, rather than depending on that job's config being right.
      - name: Build LAMMPS with backmap + molecule + rigid packages
        run: |
          cd lammps
          mkdir -p build && cd build
          cmake ../cmake \
            -D PKG_BACKMAP=yes \
            -D PKG_MOLECULE=yes \
            -D PKG_RIGID=yes \
            -D BUILD_MPI=on \
            -D CMAKE_BUILD_TYPE=Release \
            -D BUILD_SHARED_LIBS=off
          cmake --build . -j "$(nproc)"

      - name: Verify required styles are registered
        run: |
          lammps/build/lmp -h > lmp_help.txt
          # "Installed packages:" is one space-separated line, not one
          # name per line (cpp-ci.yml's "^BACKMAP" check only works
          # because BACKMAP happens to be listed first -- word-boundary
          # match here so position in the line doesn't matter).
          grep -qw BACKMAP lmp_help.txt
          grep -qw MOLECULE lmp_help.txt
          grep -qw RIGID lmp_help.txt
          grep -q "backmap/harmonic" lmp_help.txt
          grep -qw shake lmp_help.txt

      - name: Run PET/Dacron smoke test
        working-directory: examples/pet/large
        run: |
          SCALE="${{ github.event.inputs.scale || '10' }}"
          # The example input is the generated `robust` protocol with fixed stage
          # lengths (about 60 000 steps, an hour on 2 ranks). The smoke test runs a
          # copy with every stage 1/SCALE as long and alpha SCALE times larger, so the
          # ramp still reaches lambda = 1; it prints the stage markers checked below.
          python3 "${GITHUB_WORKSPACE}/scripts/ci/make_smoke_input.py" \
            in.pet pet.backmap.lmp --scale "$SCALE" \
            --out in.pet.smoke --out-backmap pet.backmap.smoke.lmp | tee smoke.meta
          # This network's large comm_modify cutoff (spans most of the box)
          # scales poorly with rank count -- see Section "Parallel
          # performance" in the paper. 2 ranks keeps this fast without
          # hitting that regression; this is a correctness smoke test, not
          # a performance benchmark.
          mpirun -np 2 --oversubscribe \
            "${GITHUB_WORKSPACE}/lammps/build/lmp" \
            -in in.pet.smoke -log smoke.log \
            2>&1 | tee smoke.out

      - name: Check for hard failures
        working-directory: examples/pet/large
        run: |
          if grep -qi "^ERROR" smoke.out; then
            echo "::error::LAMMPS reported an ERROR"
            exit 1
          fi
          if grep -qiE "\bnan\b|\binf\b" smoke.out; then
            echo "::error::NaN/Inf detected in output"
            grep -inE "\bnan\b|\binf\b" smoke.out | head -5
            exit 1
          fi
          for marker in "EQ done" "RAMP done" "PRODUCTION done"; do
            if ! grep -q "$marker" smoke.out; then
              echo "::error::Missing expected marker: $marker (run did not complete all stages)"
              exit 1
            fi
          done

      - name: Sanity-check thermo values stayed bounded
        working-directory: examples/pet/large
        run: |
          python3 - <<'PY'
          import re, sys

          # Same rough scale check used to distinguish "genuinely equilibrating"
          # from "detonating" in the 2026-07-27/28 debugging session: a
          # healthy PET/dacron run ends with E_bond/E_angle in the thousands,
          # not the hundreds-of-thousands-to-millions range. The ramp of the
          # shortened input is 1/SCALE as long as the real one, so its
          # transient (energies of 1e6 kcal/mol, 3e4 K, cooled by the
          # thermostat within the staged NVT) is larger than in a full run and
          # is not judged. The bound applies to the last thermo block of the log,
          # which is the production run, and the run must have cooled back to
          # near the target temperature.
          MAX_ENERGY = 5e5
          MAX_FINAL_TEMP = 1000.0

          blocks = []
          with open("smoke.log") as f:
              in_thermo = False
              cols = []
              for line in f:
                  s = line.strip()
                  if s.startswith("Step") and "Temp" in s:
                      cols = s.split()
                      in_thermo = True
                      blocks.append([])
                      continue
                  if in_thermo:
                      if s.startswith("WARNING"):
                          continue  # LAMMPS prints warnings between thermo rows
                      parts = s.split()
                      if len(parts) != len(cols) or not parts or not re.match(r"^-?\d", parts[0]):
                          in_thermo = False
                          continue
                      blocks[-1].append(dict(zip(cols, parts)))

          checked = blocks[-1] if blocks else []
          if len(checked) < 3:
              print("::error::the production run has fewer than three thermo rows")
              sys.exit(1)

          bad = []
          for row in checked:
              step = int(float(row.get("Step", 0)))
              for key in ("PotEng", "E_bond", "E_angle"):
                  if key in row:
                      try:
                          val = abs(float(row[key]))
                      except ValueError:
                          continue
                      if val > MAX_ENERGY:
                          bad.append((step, key, row[key]))

          final_temp = float(checked[-1]["Temp"])
          print(f"parsed {len(blocks)} thermo blocks, checked the last one ({len(checked)} rows, production), final temperature {final_temp:.0f} K")
          if bad:
              print(f"::error::{len(bad)} thermo rows exceeded the {MAX_ENERGY:.0e} sanity bound in the production run")
              for step, key, val in bad[:20]:
                  print(f"  step={step} {key}={val}")
              sys.exit(1)
          if final_temp > MAX_FINAL_TEMP:
              print(f"::error::final temperature {final_temp:.0f} K above {MAX_FINAL_TEMP:.0f} K: the run did not cool")
              sys.exit(1)
          print("Production run stayed within sane bounds and cooled to the target range.")
          PY

      - name: Upload smoke test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pet-dacron-smoke-logs
          path: |
            examples/pet/large/smoke.out
            examples/pet/large/smoke.log
          retention-days: 30
