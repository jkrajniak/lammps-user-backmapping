# PE backmapping settings -- fully LAMMPS-native variant.
#
# Identical to ../pe/settings.yaml except: cg_system and molecules[].source
# both use format: lammps (a LAMMPS data file for cg_system, and a data +
# bounded input_script pair for the AT fragment) instead of GROMACS
# .gro/.top for either. Bead type and atom-reference values are LAMMPS
# numeric type/atom IDs (as strings) rather than symbolic GROMACS names,
# per the numeric-ID convention documented in
# openspec/changes/lammps-native-at-fragment-input/design.md. See
# ../pe/README.md for the physical system description.

